plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jingdari'
version = '0.0.1-SNAPSHOT'
description = 'omong'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0")
}

dependencies {
    // --- 화면/웹 (Spring Boot 4 모듈식 스타터) ---
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // --- JSON(Jackson) ---
    // Boot 4는 모듈화되어 webmvc 스타터가 Jackson을 자동으로 안 가져온다.
    // @RequestBody/@ResponseBody(JSON)와 ObjectMapper/JsonNode 사용에 필수이므로 명시적으로 추가.
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'com.fasterxml.jackson.core:jackson-databind'   // 버전은 Boot BOM이 관리

    // --- AI: Claude(Anthropic) 기본 + Ollama(로컬) 폴백용 ---
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'   // Claude (기본)
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'      // 로컬 폴백/대체

    // --- [추후] OpenAI 비교 테스트용 ---
    // implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // --- DB: 제보된 키오스크 스펙/메뉴 저장 (MariaDB + JPA) ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // --- [추후] RAG용 MariaDB 벡터 스토어 ---
    // implementation 'org.springframework.ai:spring-ai-starter-vector-store-mariadb'
    // implementation 'org.springframework.ai:spring-ai-vector-store-advisor'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// JSON ↔ record 바인딩이 파라미터 이름에 의존하므로 -parameters 보장
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
