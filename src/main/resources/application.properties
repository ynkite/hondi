# =====================================================================
#  omong application config  (COMMITTED to GitHub)
# ---------------------------------------------------------------------
#  - Only non-secret values and ${PLACEHOLDER} refs live here.
#  - Real secrets (MindLogic / Kakao keys) are in application-secret.properties,
#    which is git-ignored and shared with teammates privately (KakaoTalk, etc.).
#  - "spring.profiles.include=secret" activates the secret profile, so Spring
#    auto-loads application-secret.properties and fills the ${...} below.
#    If that file is missing the app still boots and Kakao login falls back
#    to the name/phone signup.
#  (Comments are English so .properties never shows mojibake in any editor.)
# =====================================================================

spring.application.name=omong
spring.profiles.include=secret

# =====================================================================
#  1. File upload (kiosk photos)
#     Max size when receiving a photo for report/learn. Save location = section 5.
# =====================================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# =====================================================================
#  2. Database & JPA (MariaDB)
#     - DB "omong" is auto-created on connect (createDatabaseIfNotExist)
#     - Tables auto-created/updated (ddl-auto=update)
#     - Password defaults to 1234; override via env DB_PASSWORD or the secret file
# =====================================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/omong?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Note: app_user.created_at is stored as KST LocalDateTime in the entity (not UTC).

# =====================================================================
#  3. AI engine (MindLogic gateway)
#     - provider: mindlogic (default) | claude | ollama | mock
#       Falls back to rule/DB logic on failure (demo never dies).
#     - models: fallback order, first success wins. Change this one line to swap.
#     - api-key is SECRET -> injected from MINDLOGIC_API_KEY (secret file)
# =====================================================================
kiosk.ai.provider=mindlogic
kiosk.ai.models=claude-sonnet-4-6,gpt-5.2,gemini-3-flash-preview
mindlogic.base-url=https://factchat-cloud.mindlogic.ai/v1/gateway
mindlogic.api-key=${MINDLOGIC_API_KEY:}

# =====================================================================
#  4. Kakao login
#     - REST API key / client secret are SECRET -> injected from the secret file.
#       If empty, the "Start with Kakao" button auto-routes to name/phone signup.
#     - redirect-uri is not secret, but MUST exactly match the Kakao console value.
#       On deploy, also register the real domain callback in the console and
#       override with the KAKAO_REDIRECT_URI env var
#       (e.g. https://YOUR_DOMAIN/login/kakao/callback).
# =====================================================================
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/kakao/callback}

# =====================================================================
#  5. Upload file storage location
#     /api/report (report/learn) saves the original photo (_full.jpg) and the
#     per-menu product crops (itN.jpg) here, grouped by brand, and serves them
#     back at /uploads/**. Default is ./data/uploads, relative to the process
#     working directory (see below). On deploy use an absolute path on a
#     persistent volume, e.g. KIOSK_UPLOAD_DIR=/data/uploads.
#     Note: recognize/analyze do NOT save files (in-memory AI processing).
# =====================================================================
kiosk.upload-dir=${KIOSK_UPLOAD_DIR:./data/uploads}
