# =====================================================================
#  omong application config  (THIS FILE IS COMMITTED to GitHub)
# ---------------------------------------------------------------------
#  - Keep only non-secret values and ${PLACEHOLDER} references here.
#  - Real secret values (MindLogic / Kakao keys) live in
#    application-secret.properties, which is git-ignored and shared
#    with teammates privately (e.g. KakaoTalk), NOT committed.
#  - "spring.profiles.include=secret" activates the "secret" profile,
#    so Spring auto-loads application-secret.properties and fills the
#    ${...} placeholders below. If that file is missing the app still
#    boots, and Kakao login just falls back to the name/phone signup.
#  NOTE: .properties comments are ASCII on purpose (Latin-1 safe) so
#        they never turn into mojibake in any editor.
# =====================================================================

spring.application.name=omong
spring.profiles.include=secret

# =====================================================================
#  1. File upload (kiosk photos)
# =====================================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# =====================================================================
#  2. Database & JPA (MariaDB)
#     - DB "omong" is auto-created on connect (createDatabaseIfNotExist)
#     - Tables are auto-created/updated (ddl-auto=update)
#     - Password defaults to 1234; override via env DB_PASSWORD or secret
# =====================================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/omong?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =====================================================================
#  3. AI engine (MindLogic gateway)
#     - provider: mindlogic (default) | claude | ollama | mock
#       On failure it falls back to rule/DB logic (demo never dies).
#     - models: fallback order, first success wins. Change this one line.
#     - api-key is SECRET -> injected from MINDLOGIC_API_KEY (secret file)
# =====================================================================
kiosk.ai.provider=mindlogic
kiosk.ai.models=claude-sonnet-4-6,gpt-5.2,gemini-3-flash-preview
mindlogic.base-url=https://factchat-cloud.mindlogic.ai/v1/gateway
mindlogic.api-key=${MINDLOGIC_API_KEY:}

# =====================================================================
#  4. Kakao login
#     - REST API key / client secret are SECRET -> injected from the
#       secret file. If empty, the "Start with Kakao" button auto-routes
#       to the name/phone signup (app still works).
#     - redirect-uri is NOT secret, but MUST exactly match the value
#       registered in the Kakao developer console.
# =====================================================================
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/kakao/callback}
